<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Menepi Sejenak | Tembemburi Jawi</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    font-family: "Georgia", serif;
    background: #000;
    overflow: hidden;
}

/* === SCREEN === */
.screen {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100svh; /* SAFE viewport height */
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    transition: opacity 1.2s ease;
}

.screen.active {
    opacity: 1;
    z-index: 1;
}

/* === BACKGROUND IMAGE FULL TANPA KEPOTONG === */
.screen img.bg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: contain; /* INI KUNCINYA */
    background: #000;
}

/* === CONTENT === */
.content {
    position: relative;
    z-index: 2;
    background: rgba(0,0,0,0.45);
    padding: 22px;
    border-radius: 14px;
    max-width: 92%;
    color: #fff;
    text-align: center;
}

/* === TEXT RESPONSIVE === */
h1 {
    font-size: clamp(18px, 5vw, 26px);
    line-height: 1.4;
    font-weight: normal;
    margin: 0;
}

p {
    font-size: clamp(14px, 4.5vw, 18px);
    line-height: 1.6;
    margin: 0;
}

/* === BUTTON === */
button {
    margin-top: 18px;
    padding: 10px 26px;
    font-size: 15px;
    border: none;
    border-radius: 999px;
    background: #c8a25a;
    color: #000;
    cursor: pointer;
}
</style>
</head>

<body>

<div class="screen active">
    <img class="bg" src="img1.png">
    <div class="content">
        <h1>Jika hari ini terasa melelahkan…</h1>
        <button onclick="next()">lanjut</button>
    </div>
</div>

<div class="screen">
    <img class="bg" src="img2.jpg">
    <div class="content">
        <p>Mungkin bukan tubuhmu yang lelah,<br>melainkan pikiran yang terlalu penuh.</p>
        <button onclick="next()">lanjut</button>
    </div>
</div>

<div class="screen">
    <img class="bg" src="img3.png">
    <div class="content">
        <p>Kamu tidak harus pergi jauh.<br><br>
        Kadang, cukup berhenti…<br><b>dan menepi sejenak.</b></p>
        <button onclick="next()">lanjut</button>
    </div>
</div>
